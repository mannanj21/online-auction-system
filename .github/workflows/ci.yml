name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20.x"
        cache: 'npm'
        cache-dependency-path: './server/package-lock.json'

    - name: Cache mongodb-memory-server binary
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.mongodb-binaries
        key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}
        restore-keys: |
          mongodb-binaries-${{ runner.os }}-

    - name: Install dependencies (Server)
      working-directory: ./server
      run: npm ci || npm install

    - name: Pre-download mongodb-memory-server binary
      working-directory: ./server
      run: node -e "import('mongodb-memory-server').then(async m => { const s = await m.MongoMemoryServer.create(); await s.stop(); console.log('Binary ready'); })"
      env:
        MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries

    - name: Run Tests (Server)
      working-directory: ./server
      run: npm test
      env:
        MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20.x"
        cache: 'npm'
        cache-dependency-path: './client/package-lock.json'

    - name: Install dependencies (Client)
      working-directory: ./client
      run: npm ci || npm install

    - name: Build (Client)
      working-directory: ./client
      run: npm run build
