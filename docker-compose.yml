version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ORIGIN=http://localhost:5173
      - MONGO_URL=${MONGO_URL:-mongodb://mongo:27017/auction}
      - JWT_SECRET=${JWT_SECRET:-fallback_secret}
      - JWT_EXPIRES_IN=7d
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - REDIS_URL=redis://redis:6379
      - BID_INCREMENT_MIN=1
      - BID_INCREMENT_MAX=10
    depends_on:
      - mongo
      - redis
    networks:
      - auction-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    networks:
      - auction-network
    depends_on:
      - server

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - auction-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - auction-network

networks:
  auction-network:
    driver: bridge

volumes:
  mongo-data:
